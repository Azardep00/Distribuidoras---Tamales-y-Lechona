spring.application.name=tamales-lechona-api

# BD Neon
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-calm-fire-b5y4pcy1-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Umbral usado por el observer AlertaStock para avisar cuando el stock queda bajo
inventario.stock-minimo=5

# Microservicio de clima xd
microservicio.clima.url=https://api.open-meteo.com

# Microservicio independiente de Notificaciones (REST sincrono)
microservicio.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8081}

# -------------------------------------------------------------------
# Kafka (rama feature/kafka - objetivo de aprendizaje)
# -------------------------------------------------------------------
# Por defecto se sigue notificando por REST, para no obligar a nadie del
# equipo a levantar un broker para trabajar. Ponlo en true para publicar
# el cambio de estado de un pedido como evento en Kafka.
notificaciones.kafka.habilitado=${KAFKA_HABILITADO:false}
notificaciones.kafka.topico=pedidos.estado-cambiado

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

# Productor: clave Integer (idPedido), valor JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Si el broker no responde, no bloquear la peticion mas de 5 s
spring.kafka.producer.properties.max.block.ms=5000

# Al arrancar, Spring intenta hablar con el broker. No queremos que eso frene
# el arranque ni que tumbe la app si el broker no esta levantado.
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=2s

# Seguridad para Kafka en la nube (Aiven). Los defaults dejan el uso local intacto.
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USER:x}" password="${KAFKA_PASS:x}";
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH:/etc/secrets/ca.pem}