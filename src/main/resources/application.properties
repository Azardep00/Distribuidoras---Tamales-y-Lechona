spring.application.name=tamales-lechona-api

# Base de datos H2 en memoria (para desarrollo). Mas adelante la cambiamos por PostgreSQL/MySQL.
spring.datasource.url=jdbc:h2:mem:tamaleslechona
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2, util para ver los datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Umbral usado por el observer AlertaStock para avisar cuando el stock queda bajo
inventario.stock-minimo=5
