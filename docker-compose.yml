# Kafka en modo KRaft (sin Zookeeper) para probar en local.
#
#   docker compose up -d
#   docker compose logs -f kafka     # ver que arranco
#   docker compose down              # apagar (conserva los datos)
#   docker compose down -v           # apagar y borrar los datos
#
# Luego arrancar el API core con notificaciones.kafka.habilitado=true
# (o la variable de entorno KAFKA_HABILITADO=true).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-tamales
    ports:
      - "9092:9092"
    # Los mensajes viven en un volumen, no adentro del contenedor. Asi un
    # "docker compose down" no los borra.
    volumes:
      - kafka-datos:/var/lib/kafka/data
    environment:
      # Un solo nodo que hace de broker y de controller (KRaft).
      KAFKA_NODE_ID: 1
      # Carpeta de datos de Kafka. Se declara explicita a proposito para que
      # no dependa del valor por defecto de la imagen y no pueda quedar
      # desincronizada con el volumen de mas abajo.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  # Datos de Kafka (los mensajes). "docker compose down" conserva este
  # volumen; "docker compose down -v" lo borra.
  kafka-datos:
