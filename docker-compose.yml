# Kafka en modo KRaft (sin Zookeeper) para probar en local.
#
#   docker compose up -d
#   docker compose logs -f kafka     # ver que arranco
#   docker compose down              # apagar (conserva los datos)
#   docker compose down -v           # apagar y borrar los datos
#
# Luego arrancar el API core con notificaciones.kafka.habilitado=true
# (o la variable de entorno KAFKA_HABILITADO=true).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-tamales
    ports:
      - "9092:9092"
    environment:
      # Un solo nodo que hace de broker y de controller (KRaft).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
